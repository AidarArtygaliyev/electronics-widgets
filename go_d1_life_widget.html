<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Задача Го — жизнь группы</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:Arial,sans-serif;color:#222}
.wrap{max-width:880px;margin:auto;padding:8px}
.board{position:relative;width:100%;line-height:0;user-select:none}
.board img{display:block;width:100%;height:auto}
.point{position:absolute;width:8.5%;aspect-ratio:1;border:0;border-radius:50%;background:transparent;
transform:translate(-50%,-50%);cursor:pointer;padding:0;z-index:3}
.point:hover{background:rgba(255,255,255,.10)}
.point:focus{outline:2px solid rgba(40,100,220,.45);outline-offset:-2px}
.stone{position:absolute;width:10.75%;aspect-ratio:1;border-radius:50%;
transform:translate(-50%,-50%);pointer-events:none;z-index:6}
.black{background:
radial-gradient(circle at 34% 27%,#777 0%,#3b3b3b 18%,#151515 48%,#050505 76%,#000 100%);
box-shadow:inset -5px -7px 8px rgba(0,0,0,.55),4px 5px 4px rgba(0,0,0,.35)}
.white{background:
repeating-linear-gradient(165deg,rgba(165,165,165,.24) 0 2px,rgba(255,255,255,.12) 2px 7px),
radial-gradient(circle at 34% 24%,#fff 0%,#f8f8f8 28%,#e4e4e4 62%,#bcbcbc 100%);
box-shadow:inset -4px -5px 7px rgba(150,150,150,.30),4px 5px 4px rgba(0,0,0,.30)}
.message{min-height:64px;margin:13px auto 0;text-align:center;font-size:20px;font-weight:700;line-height:1.45}
.good{color:#218739} .bad{color:#c62828}
.reset{display:none;margin:4px auto 0;border:0;border-radius:9px;padding:10px 18px;background:#666;color:#fff;
font-size:15px;font-weight:700;cursor:pointer}
.reset.show{display:block}

.marker{
 position:absolute;
 width:4.2%;
 aspect-ratio:1;
 transform:translate(-50%,-50%);
 border-radius:50%;
 background:#e7b94f;
 border:2px solid #4a3a20;
 color:#111;
 display:flex;
 align-items:center;
 justify-content:center;
 font-family:Arial,sans-serif;
 font-size:clamp(13px,2.1vw,22px);
 font-weight:700;
 line-height:1;
 z-index:4;
 pointer-events:none;
 box-shadow:0 1px 2px rgba(0,0,0,.28);
}

</style></head>
