<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шахматные часы</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff}
.wrap{max-width:900px;margin:auto;padding:18px}
.clockbox{position:relative;margin:42px auto 18px;max-width:820px;border:8px solid #111;border-radius:10px;padding:38px 28px 28px;background:#fafafa}
.inner{border:4px solid #111;padding:24px 22px;display:flex;gap:34px;justify-content:center}
.dial{width:46%;aspect-ratio:1;min-width:250px}
.dial svg{width:100%;height:100%;display:block}
.face{fill:#fff;stroke:#111;stroke-width:4}
.tick{stroke:#111;stroke-width:3;stroke-linecap:round}
.major{stroke-width:5}
.num{font-family:Arial,sans-serif;font-size:34px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
.minute-hand{stroke:#111;stroke-width:9;stroke-linecap:round;transform-origin:200px 200px;transition:transform .18s linear}.hand{stroke:#111;stroke-width:4;stroke-linecap:round;transform-origin:200px 200px;transition:transform .18s linear}
.hub{fill:#fff;stroke:#111;stroke-width:5}
.button{position:absolute;top:-54px;width:100px;height:55px}
.button.left{left:20%}.button.right{right:20%}
.stem{position:absolute;left:39px;bottom:0;width:22px;height:30px;background:#fff;border:7px solid #111;border-bottom:0}
.cap{position:absolute;left:16px;top:0;width:68px;height:25px;background:#fff;border:7px solid #111;border-radius:10px}
.button.down{top:-39px}
.feet:before,.feet:after{content:"";position:absolute;bottom:-27px;width:58px;height:27px;background:#111;border-radius:0 0 8px 8px}
.feet:before{left:10%}.feet:after{right:10%}
@media(max-width:650px){
 .clockbox{padding:28px 12px 18px;border-width:6px}
 .inner{padding:15px 8px;gap:8px}
 .dial{min-width:0;width:49%}
 .num{font-size:31px}
 .button{transform:scale(.75);transform-origin:bottom center}
 .button.left{left:15%}.button.right{right:15%}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="clockbox">
   <div class="button left down" id="btnL"><div class="cap"></div><div class="stem"></div></div>
   <div class="button right" id="btnR"><div class="cap"></div><div class="stem"></div></div>
   <div class="inner">
     <div class="dial"><svg viewBox="0 0 400 400"><circle class="face" cx="200" cy="200" r="180"/><g id="ticksL"></g><g id="numsL"></g><line class="minute-hand" id="minuteL" x1="200" y1="200" x2="200" y2="92"/><line class="hand" id="handL" x1="200" y1="200" x2="200" y2="60"/><circle class="hub" cx="200" cy="200" r="12"/></svg></div>
     <div class="dial"><svg viewBox="0 0 400 400"><circle class="face" cx="200" cy="200" r="180"/><g id="ticksR"></g><g id="numsR"></g><line class="minute-hand" id="minuteR" x1="200" y1="200" x2="200" y2="92"/><line class="hand" id="handR" x1="200" y1="200" x2="200" y2="60"/><circle class="hub" cx="200" cy="200" r="12"/></svg></div>
   </div>
   <div class="feet"></div>
 </div>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
function makeFace(ticksId, numsId){
 const ticks=document.getElementById(ticksId), nums=document.getElementById(numsId);
 for(let i=0;i<60;i++){
  const a=i*6*Math.PI/180, major=i%5===0, r1=major?154:163, r2=174;
  const l=document.createElementNS(NS,"line");
  l.setAttribute("x1",200+Math.sin(a)*r1); l.setAttribute("y1",200-Math.cos(a)*r1);
  l.setAttribute("x2",200+Math.sin(a)*r2); l.setAttribute("y2",200-Math.cos(a)*r2);
  l.setAttribute("class",major?"tick major":"tick"); ticks.appendChild(l);
 }
 for(let n=1;n<=12;n++){
  const a=n*30*Math.PI/180,r=126,t=document.createElementNS(NS,"text");
  t.setAttribute("x",200+Math.sin(a)*r); t.setAttribute("y",200-Math.cos(a)*r);
  t.setAttribute("class","num"); t.textContent=n; nums.appendChild(t);
 }
}
makeFace("ticksL","numsL"); makeFace("ticksR","numsR");

let active=0, left=0, right=0;
let cycle=0;          // 0: левый 6 сек, правый 10 сек; 1: левый 10 сек, правый 6 сек
let phase=0;

function setHand(id, sec){document.getElementById(id).style.transform=`rotate(${(sec%60)*6}deg)`}
function setMinuteHand(id, sec){document.getElementById(id).style.transform=`rotate(${(sec/60)*6}deg)`}
function buttons(){
 document.getElementById("btnL").classList.toggle("down",active===1);
 document.getElementById("btnR").classList.toggle("down",active===0);
}
function render(){setHand("handL",left);setHand("handR",right);setMinuteHand("minuteL",left);setMinuteHand("minuteR",right);buttons()}
function currentDuration(){
 if(cycle===0) return active===0 ? 6 : 10;
 return active===0 ? 10 : 6;
}
render();

setInterval(()=>{
 if(active===0) left++; else right++;
 phase++;

 if(phase===currentDuration()){
   phase=0;
   if(active===0){
     active=1;
   }else{
     active=0;
     cycle=1-cycle;
   }
 }
 render();
},1000);
</script>
</body>
</html>
